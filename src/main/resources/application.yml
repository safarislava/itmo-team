spring:
  application:
    name: itmo-team-api

  profiles:
    default: dev

  docker:
    compose:
      enabled: false

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

security:
  jwt:
    secret: "very-secret-token-must-be-at-least-32-bytes-long"
  access-token:
    expiration-seconds: 600
  refresh-token:
    expiration-seconds: 1209600

app:
  ai-detector:
    enabled: true
    gemini:
      api-key: "${GEMINI_API_KEY}"
      model: "gemini-3.5-flash-lite"
  github:
    token: "${GITHUB_TOKEN}"
    base-url: "https://api.github.com"
  submission-queue:
    consumer-group: "runners-group"
    max-len: 5000
    reconcile:
      enabled: true
      delay-ms: 60000
      batch-size: 500

