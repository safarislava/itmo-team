spring:
  docker:
    compose:
      enabled: true
      file: docker-compose.local.yml

  datasource:
    master:
      jdbc-url: jdbc:postgresql://localhost:5432/dev
      username: postgres
      password: postgres
      pool-name: HikariPool-Master
    slave:
      jdbc-url: jdbc:postgresql://localhost:5432/dev
      username: postgres
      password: postgres
      pool-name: HikariPool-Slave

  mail:
    host: localhost
    port: 1025
    username: admin
    password: admin
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

app:
  ai-detector:
    gemini:
      api-key: ${GEMINI_API_KEY:}
  github:
    token: ${GITHUB_TOKEN:}
  live-coding:
    ws-url-template: ws://localhost:8080/ws/interviews/%s
    ice-servers:
      - urls:
          - "stun:stun.l.google.com:19302"

storage:
  s3:
    bucket: itmo-resumes
    endpoint: http://localhost:9000
    region: us-east-1
    access-key: minioadmin
    secret-key: minioadmin
    path-style-access-enabled: true
