spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/dev
    username: postgres
    password: postgres

  mail:
    host: localhost
    port: 587
    username: admin
    password: admin
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

app:
  datasource:
    replica:
      url: jdbc:postgresql://localhost:5432/dev
      username: postgres
      password: postgres

storage:
  s3:
    bucket: itmo-resumes
    endpoint: http://localhost:9000
    region: us-east-1
    access-key: minioadmin
    secret-key: minioadmin
    path-style-access-enabled: true

