    description: Candidates' applications to vacancies and their resumes.
    parent: Hiring
    kind: nav
  - name: Screening
    summary: HR screening
    description: HR screening and ranking of applications.
    parent: Hiring
    kind: nav
  - name: Interviews
    summary: Interviews
    description: Live-coding interviews.
    parent: Hiring
    kind: nav

  - name: Assessment
    summary: Assessment
    description: Contests and the task library.
    kind: nav
  - name: Contests
    summary: Contests
    description: Contests attached to vacancies.
    parent: Assessment
    kind: nav
  - name: Tasks
    summary: Tasks
    description: Task library and tests.
    parent: Assessment
    kind: nav
  - name: Submissions
    summary: Submissions
    description: Solutions submitted to tasks.
    parent: Assessment
    kind: nav

  - name: Administration
    summary: Administration
    description: Analytics and platform configuration.
    kind: nav
  - name: Analytics
    summary: Analytics
    description: Productivity and hiring metrics.
    parent: Administration
    kind: nav
  - name: Dictionaries
    summary: Dictionaries
    description: System dictionaries of skills and programming languages.
    parent: Administration
    kind: nav
  - name: System
    summary: System
    description: Monitoring and configuration of the platform.
    parent: Administration
    kind: nav

