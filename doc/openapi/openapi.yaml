openapi: 3.2.0

info:
  title: It's More Than Team API
  version: 0.0.1
  license:
    name: Apache 2.0
    identifier: Apache-2.0
  description: |
    REST API of the staff management system.

    - All request and response bodies are represented as JSON (`application/json`).
    - Errors are reported as problem details (`application/problem+json`).
    - Collections are paginated, `page` is zero-based.
    - Every endpoint requires an access token (`Authorization: Bearer <token>`) unless it
      is marked as public.
    - Access tokens are kept in an `HttpOnly` cookie.

servers:
  - url: https://itmorethan.team
    name: prod
    description: Production Server
  - url: https://dev.itmorethan.team
    name: dev
    description: Development Server
  - url: http://localhost:8080
    name: local
    description: Local Server

security:
  - BearerAuth: [ ]

tags:
  - name: Accounts
    summary: Accounts
    description: Authentication, user accounts and profiles.
    kind: nav
  - name: Auth
    summary: Authentication
    description: Authentication and token management.
    parent: Accounts
    kind: nav
  - name: Persons
    summary: Persons
    description: User accounts and profiles.
