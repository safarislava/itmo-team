description: |
  Sets the refresh token that is valid for 2 weeks as an `HttpOnly` cookie restricted to `/api/auth`.
schema:
  type: string
examples:
  issued:
    summary: A new refresh token
    serializedValue: refreshToken=eyJhbGciOiJIUzI1NiJ9...; Path=/api/auth; Max-Age=1209600; HttpOnly; Secure; SameSite=Strict
