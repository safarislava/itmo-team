parameters:
  - $ref: "../../openapi.yaml#/components/parameters/TaskId"
get:
  tags: [ Tasks ]
  operationId: getTask
  summary: Get a task
  description: |
    A candidate must be a participant of a running contest with the task.
  security:
    - BearerAuth: [ CANDIDATE ]
    - BearerAuth: [ TEAM_LEAD ]
    - BearerAuth: [ ADMIN ]
  responses:
    '200':
      description: The task.
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/Task"
    '401':
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    '403':
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    '404':
      $ref: "../../openapi.yaml#/components/responses/NotFound"
put:
  tags: [ Tasks ]
  operationId: updateTask
  summary: Edit a task
  description: |
    A team lead may edit only the tasks they authored, an administrator any task.
  security:
    - BearerAuth: [ TEAM_LEAD ]
    - BearerAuth: [ ADMIN ]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../openapi.yaml#/components/schemas/TaskRequest"
  responses:
    '200':
      description: The updated task.
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/Task"
    '400':
      $ref: "../../openapi.yaml#/components/responses/BadRequest"
    '401':
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    '403':
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    '404':
      $ref: "../../openapi.yaml#/components/responses/NotFound"
delete:
  tags: [ Tasks ]
  operationId: deleteTask
  summary: Delete a task
  description: |
    Deletes the task with its tests and submissions and removes it from all contests.

    A team lead may delete only the tasks they authored, an administrator any task.
  security:
    - BearerAuth: [ TEAM_LEAD ]
    - BearerAuth: [ ADMIN ]
  responses:
    '204':
      description: The task was deleted.
    '401':
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    '403':
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    '404':
      $ref: "../../openapi.yaml#/components/responses/NotFound"
