parameters:
  - $ref: "../../openapi.yaml#/components/parameters/ContestId"
get:
  tags: [ Contests ]
  operationId: getContest
  summary: Get a contest
  description: "**Roles:** `CANDIDATE` (participant), `HR`, `TEAM_LEAD`, `ADMIN`."
  responses:
    '200':
      description: The contest.
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/Contest"
    '401':
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    '403':
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    '404':
      $ref: "../../openapi.yaml#/components/responses/NotFound"
put:
  tags: [ Contests ]
  operationId: updateContest
  summary: Reschedule a contest
  description: |
    A contest may be rescheduled only before it starts.

    **Roles:** `TEAM_LEAD`.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../openapi.yaml#/components/schemas/ContestRequest"
  responses:
    '200':
      description: The updated contest.
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/Contest"
    '400':
      $ref: "../../openapi.yaml#/components/responses/BadRequest"
    '401':
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    '403':
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    '404':
      $ref: "../../openapi.yaml#/components/responses/NotFound"
    '409':
      description: The contest has already started.
      content:
        application/problem+json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/Problem"
delete:
  tags: [ Contests ]
  operationId: deleteContest
  summary: Delete a contest
  description: |
    Deletes the contest with all its submissions. Tasks remain in the library.

    **Roles:** `TEAM_LEAD`.
  responses:
    '204':
      description: The contest was deleted.
    '401':
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    '403':
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    '404':
      $ref: "../../openapi.yaml#/components/responses/NotFound"
