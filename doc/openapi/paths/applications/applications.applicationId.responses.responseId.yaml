parameters:
  - $ref: "../../openapi.yaml#/components/parameters/ApplicationId"
  - $ref: "../../openapi.yaml#/components/parameters/ResponseId"
put:
  tags: [ Screening ]
  operationId: updateApplicationResponse
  summary: Correct an HR assessment
  description: |
    Author of the assessment updates score of metrics. The averaged score is recalculated.
  security:
    - BearerAuth: [ HR ]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../openapi.yaml#/components/schemas/ScoreMetrics"
  responses:
    '200':
      description: The updated assessment.
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/ApplicationResponse"
    '400':
      $ref: "../../openapi.yaml#/components/responses/BadRequest"
    '401':
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    '403':
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    '404':
      $ref: "../../openapi.yaml#/components/responses/NotFound"
delete:
  tags: [ Screening ]
  operationId: deleteApplicationResponse
  summary: Withdraw an HR assessment
  description: |
    The score of metrics is deleted. The averaged score is recalculated. The application returns to the screening queue. 
  security:
    - BearerAuth: [ HR ]
    - BearerAuth: [ ADMIN ]
  responses:
    '204':
      description: The assessment was deleted.
    '401':
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    '403':
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    '404':
      $ref: "../../openapi.yaml#/components/responses/NotFound"
