get:
  tags: [ Analytics ]
  operationId: getHiringStatistics
  summary: Get hiring metrics
  description: |
    Aggregated hiring metrics of the company or one of its teams.

    The representation is chosen by the `Accept` header: `application/json` returns
    the metrics, `application/pdf` a report with charts and tables, `text/csv` the raw values.

    **Roles:** `MANAGER`, `ADMIN`.
  parameters:
    - name: from
      in: query
      required: true
      description: Inclusive start of the time interval.
      schema:
        type: string
        format: date-time
    - name: to
      in: query
      required: true
      description: Exclusive end of the time interval.
      schema:
        type: string
        format: date-time
    - name: teamId
      in: query
      schema:
        type: integer
        format: int64
    - name: companyId
      in: query
      description: Required for administrators, ignored for managers.
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: Hiring metrics.
      headers:
        Content-Disposition:
          $ref: "../../openapi.yaml#/components/headers/ContentDisposition"
          description: File name of the report, only for `application/pdf` and `text/csv`.
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/HiringStatistics"
        application/pdf:
          schema:
            type: string
            contentMediaType: application/pdf
        text/csv:
          schema:
            type: string
    '400':
      $ref: "../../openapi.yaml#/components/responses/BadRequest"
    '401':
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    '403':
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    '406':
      description: The `Accept` header asks for an unsupported representation.
      content:
        application/problem+json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/Problem"
