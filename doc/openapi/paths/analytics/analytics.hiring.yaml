get:
  tags: [ Analytics ]
  operationId: getHiringStatistics
  summary: Get hiring metrics
  description: |
    Aggregated hiring metrics of the manager's company or one of its teams.
  security:
    - BearerAuth: [ MANAGER ]
  parameters:
    - name: from
      in: query
      required: true
      description: Inclusive start of the time interval.
      schema:
        type: string
        format: date-time
    - name: to
      in: query
      required: true
      description: Exclusive end of the time interval.
      schema:
        type: string
        format: date-time
    - name: teamId
      in: query
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: Hiring metrics.
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/HiringStatistics"
    '400':
      $ref: "../../openapi.yaml#/components/responses/BadRequest"
    '401':
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    '403':
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
