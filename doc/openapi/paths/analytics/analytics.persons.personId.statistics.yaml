parameters:
  - $ref: "../../openapi.yaml#/components/parameters/PersonId"
get:
  tags: [ Analytics ]
  operationId: getPersonStatistics
  summary: Get activity statistics of an employee
  description: |
    GitHub activity of one employee for the period: totals and time series for charts.
    Built from the daily reports collected at 00:00.

    A developer sees only their own statistics, a team lead sees statistics of their team members,
    a manager sees statistics of all company employees.
  security:
    - BearerAuth: [ DEVELOPER ]
    - BearerAuth: [ TEAM_LEAD ]
    - BearerAuth: [ MANAGER ]
    - BearerAuth: [ ADMIN ]
  parameters:
    - name: from
      in: query
      required: true
      description: Inclusive start of the time interval.
      schema:
        type: string
        format: date-time
    - name: to
      in: query
      required: true
      description: Exclusive end of the time interval.
      schema:
        type: string
        format: date-time
    - name: granularity
      in: query
      schema:
        $ref: "../../openapi.yaml#/components/schemas/Granularity"
  responses:
    '200':
      description: Activity statistics of the employee.
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/PersonStatistics"
    '400':
      $ref: "../../openapi.yaml#/components/responses/BadRequest"
    '401':
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    '403':
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    '404':
      $ref: "../../openapi.yaml#/components/responses/NotFound"
