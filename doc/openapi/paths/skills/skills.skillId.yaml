parameters:
  - $ref: "../../openapi.yaml#/components/parameters/SkillId"
put:
  tags: [ Dictionaries ]
  operationId: updateSkill
  summary: Edit a skill
  security:
    - BearerAuth: [ ADMIN ]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../openapi.yaml#/components/schemas/SkillRequest"
  responses:
    '200':
      description: The updated skill.
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/Skill"
    '400':
      $ref: "../../openapi.yaml#/components/responses/BadRequest"
    '401':
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    '403':
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    '404':
      $ref: "../../openapi.yaml#/components/responses/NotFound"
delete:
  tags: [ Dictionaries ]
  operationId: deleteSkill
  summary: Delete a skill
  description: |
    The skill is also removed from all vacancies and forms that reference it.
  security:
    - BearerAuth: [ ADMIN ]
  responses:
    '204':
      description: The skill was deleted.
    '401':
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    '403':
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    '404':
      $ref: "../../openapi.yaml#/components/responses/NotFound"
