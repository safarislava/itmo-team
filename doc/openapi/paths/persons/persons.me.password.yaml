put:
  tags: [ Persons ]
  operationId: changePassword
  summary: Change the password of the current user
  description: All refresh tokens of the user are revoked.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../openapi.yaml#/components/schemas/PasswordChangeRequest"
  responses:
    '204':
      description: The password was changed.
    '400':
      description: The current password is wrong or the new one failed validation.
      content:
        application/problem+json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/Problem"
    '401':
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
