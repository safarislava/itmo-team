parameters:
  - $ref: "../../openapi.yaml#/components/parameters/SubmissionId"
get:
  tags: [ Submissions ]
  operationId: getSubmission
  summary: Get a submission
  description: |
    Status and verdict of a submission with the time and memory used.

    A candidate may view only the own submissions.
  security:
    - BearerAuth: [ CANDIDATE ]
    - BearerAuth: [ HR ]
    - BearerAuth: [ TEAM_LEAD ]
    - BearerAuth: [ ADMIN ]
  responses:
    '200':
      description: The submission.
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/Submission"
    '401':
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    '403':
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    '404':
      $ref: "../../openapi.yaml#/components/responses/NotFound"
