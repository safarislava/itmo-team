post:
  tags: [ Auth ]
  operationId: createSessionTokens
  summary: Refresh the tokens of the session
  description: |
    Issues a new pair of tokens for the session the refresh token belongs to. The refresh token is taken from the
    `refreshToken` cookie. The used refresh token is revoked.
  security: [ ]
  parameters:
    - name: refreshToken
      in: cookie
      required: true
      description: Refresh token set when the session was started.
      schema:
        type: string
  responses:
    '201':
      description: A new pair of tokens issued in cookies.
      headers:
        Set-Cookie:
          $ref: "../../openapi.yaml#/components/headers/SetRefreshCookie"
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/Person"
    '401':
      description: The refresh token is missing, expired or revoked.
      content:
        application/problem+json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/Problem"
