parameters:
  - $ref: "../../openapi.yaml#/components/parameters/InterviewId"
get:
  tags: [ Interviews ]
  operationId: getInterviewFeedback
  summary: Get the feedback of an interview
  description: "**Roles:** `HR`, `TEAM_LEAD`, `MANAGER`, `ADMIN`."
  responses:
    '200':
      description: The feedback.
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/InterviewFeedback"
    '401':
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    '403':
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    '404':
      description: The interview does not exist or has no feedback yet.
      content:
        application/problem+json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/Problem"
put:
  tags: [ Interviews ]
  operationId: saveInterviewFeedback
  summary: Leave the feedback and the decision
  description: |
    Saves the review and the score of a completed interview together with the
    decision on the candidate. The application moves according to the decision,
    HR is notified. A repeated call replaces the feedback while the application is not hired.

    **Roles:** `TEAM_LEAD` of the interview.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../openapi.yaml#/components/schemas/InterviewFeedbackRequest"
  responses:
    '200':
      description: The saved feedback.
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/InterviewFeedback"
    '400':
      $ref: "../../openapi.yaml#/components/responses/BadRequest"
    '401':
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    '403':
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    '404':
      $ref: "../../openapi.yaml#/components/responses/NotFound"
    '409':
      description: The interview is not completed or the candidate is already hired.
      content:
        application/problem+json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/Problem"
