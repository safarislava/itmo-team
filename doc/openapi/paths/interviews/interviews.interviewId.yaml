parameters:
  - $ref: "../../openapi.yaml#/components/parameters/InterviewId"
get:
  tags: [ Interviews ]
  operationId: getInterview
  summary: Get an interview
  description: |
    The feedback is hidden from the candidate.

    A candidate may view only the own interviews.
  security:
    - BearerAuth: [ CANDIDATE ]
    - BearerAuth: [ HR ]
    - BearerAuth: [ TEAM_LEAD ]
    - BearerAuth: [ MANAGER ]
    - BearerAuth: [ ADMIN ]
  responses:
    '200':
      description: The interview.
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/Interview"
    '401':
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    '403':
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    '404':
      $ref: "../../openapi.yaml#/components/responses/NotFound"
