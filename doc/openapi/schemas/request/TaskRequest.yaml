type: object
required: [ name, timeLimit, memoryLimit ]
properties:
  name:
    type: string
    minLength: 1
    maxLength: 255
  description:
    type: [ string, "null" ]
    description: Statement of the task in Markdown.
  timeLimit:
    type: integer
    format: int32
    minimum: 1
    description: CPU time limit per test, in milliseconds.
  memoryLimit:
    type: integer
    format: int32
    minimum: 1
    description: Memory limit, in kilobytes. Must not exceed the limit from the system settings.
