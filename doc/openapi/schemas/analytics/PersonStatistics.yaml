type: object
description: GitHub activity statistics of an employee for the period.
required: [ person, totals, points, granularity ]
properties:
  person:
    $ref: "../../openapi.yaml#/components/schemas/PersonSummary"
  totals:
    description: Sums over the whole period.
    $ref: "../../openapi.yaml#/components/schemas/ActivityMetrics"
  points:
    type: array
    description: Sorted by `periodStart`.
    items:
      $ref: "../../openapi.yaml#/components/schemas/ProductivityPoint"
  granularity:
    $ref: "../../openapi.yaml#/components/schemas/Granularity"
