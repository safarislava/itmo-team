# TODO: probably forbid sending application after contest has ended,
# otherwise candidate won't be able to participate in it
type: object
description: Set of tasks a candidate has to solve within a fixed time window.
required: [ id, scheduledTime, duration, endTime ]
properties:
  id:
    type: integer
    format: int64
    minimum: 1
    description: Generated by the database.
  scheduledTime:
    type: string
    format: date-time
    description: Start of the contest.
  duration:
    type: string
    format: duration
    examples: [ PT3H ]
  endTime:
    type: string
    format: date-time
    readOnly: true
    description: Computed as `scheduledTime + duration`. Submissions are not accepted afterwards.
