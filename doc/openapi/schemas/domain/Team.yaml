type: object
required: [ id, name, company, teamlead ]
properties:
  id:
    type: integer
    format: int64
    minimum: 1
    description: Generated by the database.
  name:
    type: string
    minLength: 1
    maxLength: 100
    description: Unique within the company.
  company:
    $ref: "../../openapi.yaml#/components/schemas/Company"
  teamlead:
    $ref: "../../openapi.yaml#/components/schemas/PersonSummary"
