type: object
required: [ id, name, creationDate ]
properties:
  id:
    type: integer
    format: int64
    minimum: 1
    description: Generated by the database.
  name:
    type: string
    minLength: 1
    maxLength: 255
    description: Unique among all companies.
  creationDate:
    type: string
    format: date
    description: Date of the registration on the platform.
