# TODO: probably add phone number
type: object
required: [ id, name, email, role, company, team, githubId ]
properties:
  id:
    type: integer
    format: int64
    minimum: 1
    description: Generated by the database.
  name:
    type: string
    minLength: 1
    maxLength: 100
  email:
    type: string
    format: email
    maxLength: 255
  role:
    $ref: "../../openapi.yaml#/components/schemas/Role"
  company:
    description: Company the person works in. Always `null` for candidates and administrators.
    oneOf:
      - $ref: "../../openapi.yaml#/components/schemas/Company"
      - type: "null"
  team:
    description: Team the person is a member of.
    oneOf:
      - $ref: "../../openapi.yaml#/components/schemas/TeamSummary"
      - type: "null"
  githubId:
    type: [ integer, "null" ]
    format: int64
    description: Identifier of the GitHub account used to collect activity metrics.
