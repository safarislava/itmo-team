type: object
description: Algorithmic task from the task library.
required: [ id, name, description, timeLimit, memoryLimit, author ]
properties:
  id:
    type: integer
    format: int64
    minimum: 1
    description: Generated by the database.
  name:
    type: string
    minLength: 1
    maxLength: 255
  description:
    type: [ string, "null" ]
    description: Statement of the task in Markdown, including the input and output formats.
  timeLimit:
    type: integer
    format: int32
    minimum: 1
    description: CPU time limit per test, in milliseconds.
  memoryLimit:
    type: integer
    format: int32
    minimum: 1
    description: Memory limit, in kilobytes.
  author:
    $ref: "../../openapi.yaml#/components/schemas/PersonSummary"
