type: object
required: [ id, taskId, input, output, hidden ]
properties:
  id:
    type: integer
    format: int64
    minimum: 1
    description: Generated by the database.
  taskId:
    type: integer
    format: int64
    minimum: 1
  input:
    type: string
    description: Data passed to the standard input of a solution.
  output:
    type: string
    description: Expected standard output.
  hidden:
    type: boolean
    description: Hidden tests are never shown to candidates, the others serve as examples.
