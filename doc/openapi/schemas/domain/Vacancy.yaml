type: object
required: [ id, title, description, team, company, city, status, salary, skills, createdAt, closedAt ]
properties:
  id:
    type: integer
    format: int64
    minimum: 1
    description: Generated by the database.
  title:
    type: string
    minLength: 1
    maxLength: 255
  description:
    type: string
    minLength: 1
    description: Responsibilities and requirements.
  team:
    $ref: "../../openapi.yaml#/components/schemas/TeamSummary"
  company:
    $ref: "../../openapi.yaml#/components/schemas/Company"
  city:
    type: [ string, "null" ]
    maxLength: 255
    description: "`null` for remote positions."
  status:
    $ref: "../../openapi.yaml#/components/schemas/VacancyStatus"
  salary:
    type: [ integer, "null" ]
    format: int32
    minimum: 0
  skills:
    type: array
    description: Required skills.
    items:
      $ref: "../../openapi.yaml#/components/schemas/Skill"
  createdAt:
    type: string
    format: date-time
    description: Generated automatically when the vacancy is created.
  closedAt:
    type: [ string, "null" ]
    format: date-time
    description: Set when the vacancy is closed.
