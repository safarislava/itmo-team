type: object
required: [ id, title, city, status, salary, createdAt, companyId, companyName ]
properties:
  id:
    type: integer
    format: int64
    minimum: 1
    description: Generated by the database.
  title:
    type: string
    minLength: 1
    maxLength: 255
  city:
    type: [ string, "null" ]
    maxLength: 255
    description: "`null` for remote positions."
  status:
    $ref: "../../openapi.yaml#/components/schemas/VacancyStatus"
  salary:
    type: [ integer, "null" ]
    format: int32
    minimum: 0
  createdAt:
    type: string
    format: date-time
    description: Generated automatically when the vacancy is created.
  companyId:
    type: integer
    format: int64
  companyName:
    type: string
