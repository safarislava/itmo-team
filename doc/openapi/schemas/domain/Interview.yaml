type: object
required: [ id, applicationId, candidate, teamlead, vacancy, scheduledStart, scheduledEnd, status, hasRecording, feedback ]
properties:
  id:
    type: integer
    format: int64
    minimum: 1
    description: Generated by the database.
  applicationId:
    type: integer
    format: int64
    minimum: 1
    description: Application the interview was scheduled for.
  candidate:
    $ref: "../../openapi.yaml#/components/schemas/PersonSummary"
  teamlead:
    $ref: "../../openapi.yaml#/components/schemas/PersonSummary"
  vacancy:
    $ref: "../../openapi.yaml#/components/schemas/VacancySummary"
  scheduledStart:
    type: string
    format: date-time
  scheduledEnd:
    type: string
    format: date-time
    description: Always later than `scheduledStart`.
  status:
    $ref: "../../openapi.yaml#/components/schemas/InterviewStatus"
  hasRecording:
    type: boolean
    description: Whether the recording is still available (it is kept for 1 month).
  feedback:
    description: Feedback of the team lead, `null` until the interview is completed and assessed.
    oneOf:
      - $ref: "../../openapi.yaml#/components/schemas/InterviewFeedback"
      - type: "null"
