description: Assessment of an application by one HR. Each HR assesses an application at most once.
allOf:
  - type: object
    required: [ id, applicationId, hr ]
    properties:
      id:
        type: integer
        format: int64
        minimum: 1
        description: Generated by the database.
      applicationId:
        type: integer
        format: int64
        minimum: 1
      hr:
        $ref: "../../openapi.yaml#/components/schemas/PersonSummary"
  - $ref: "../../openapi.yaml#/components/schemas/ScoreMetrics"
