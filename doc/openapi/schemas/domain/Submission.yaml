type: object
description: Solution of a contest task. The source code is available at `/api/submissions/{submissionId}/source`.
required: [ id, sender, contestId, taskId, language, status, attempt, aiScore, submittedAt, result ]
properties:
  id:
    type: integer
    format: int64
    minimum: 1
    description: Generated by the database.
  sender:
    $ref: "../../openapi.yaml#/components/schemas/PersonSummary"
  contestId:
    type: integer
    format: int64
    minimum: 1
  taskId:
    type: integer
    format: int64
    minimum: 1
  language:
    $ref: "../../openapi.yaml#/components/schemas/Language"
  status:
    $ref: "../../openapi.yaml#/components/schemas/SubmissionStatus"
  attempt:
    type: integer
    format: int32
    minimum: 1
    description: Number of the attempt for the task within the contest, assigned automatically.
  aiScore:
    type: [ integer, "null" ]
    format: int32
    minimum: 0
    maximum: 100
    description: |
      Probability (in percent) that the code was plagiarised or generated by AI,
      `null` until checked. Hidden from candidates.
  submittedAt:
    type: string
    format: date-time
  result:
    description: Result of the check, `null` while the submission is queued or running.
    oneOf:
      - $ref: "../../openapi.yaml#/components/schemas/SubmissionResult"
      - type: "null"
