type: object
required: [ id, candidate, vacancy, resume, form, status, score, responsesCount ]
properties:
  id:
    type: integer
    format: int64
    minimum: 1
    description: Generated by the database.
  candidate:
    $ref: "../../openapi.yaml#/components/schemas/PersonSummary"
  vacancy:
    $ref: "../../openapi.yaml#/components/schemas/VacancySummary"
  resume:
    $ref: "../../openapi.yaml#/components/schemas/Resume"
  form:
    $ref: "../../openapi.yaml#/components/schemas/Form"
  status:
    $ref: "../../openapi.yaml#/components/schemas/ApplicationStatus"
  score:
    description: |
      Metrics averaged over all HR assessments, `null` until the first assessment.
      Hidden from candidates.
    oneOf:
      - $ref: "../../openapi.yaml#/components/schemas/ScoreMetrics"
      - type: "null"
  responsesCount:
    type: integer
    format: int32
    minimum: 0
    description: Number of HR assessments. An application is screened by two HRs.
