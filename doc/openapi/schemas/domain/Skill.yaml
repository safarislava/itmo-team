type: object
description: Hard skill from the system dictionary (e.g. a technology of a stack).
required: [ id, name, description ]
properties:
  id:
    type: integer
    format: int64
    minimum: 1
    description: Generated by the database.
  name:
    type: string
    minLength: 1
    maxLength: 255
  description:
    type: [ string, "null" ]
