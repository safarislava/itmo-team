type: object
description: Feedback and decision of the team lead after a live-coding interview.
required: [ id, review, score, decision ]
properties:
  id:
    type: integer
    format: int64
    minimum: 1
    description: Generated by the database.
  review:
    type: string
    description: Strengths and weaknesses of the candidate.
  score:
    type: integer
    format: int32
    minimum: 1
    maximum: 10
  decision:
    $ref: "../../openapi.yaml#/components/schemas/InterviewDecision"
