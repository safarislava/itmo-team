type: object
description: Questionnaire filled in by a candidate when applying to a vacancy.
required: [ id, university, motivation, petProjects, jobExp, workFormat, skills ]
properties:
  id:
    type: integer
    format: int64
    minimum: 1
    description: Generated by the database.
  university:
    type: [ string, "null" ]
    maxLength: 255
  motivation:
    type: [ string, "null" ]
  petProjects:
    type: [ string, "null" ]
  jobExp:
    type: [ string, "null" ]
    description: Description of the work experience.
  workFormat:
    oneOf:
      - $ref: "../../openapi.yaml#/components/schemas/WorkFormat"
      - type: "null"
  skills:
    type: array
    description: Skills the candidate possesses.
    items:
      $ref: "../../openapi.yaml#/components/schemas/Skill"
