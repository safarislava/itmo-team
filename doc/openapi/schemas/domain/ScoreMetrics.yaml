type: object
description: Metrics of an application, each from 0 to 100.
required: [ motivation, softSkills, petProjects, jobExp, hardSkills, workFormat ]
properties:
  motivation:
    type: integer
    format: int32
    minimum: 0
    maximum: 100
  softSkills:
    type: integer
    format: int32
    minimum: 0
    maximum: 100
  petProjects:
    type: integer
    format: int32
    minimum: 0
    maximum: 100
  jobExp:
    type: integer
    format: int32
    minimum: 0
    maximum: 100
  hardSkills:
    type: integer
    format: int32
    minimum: 0
    maximum: 100
  workFormat:
    type: integer
    format: int32
    minimum: 0
    maximum: 100
    description: How well the preferred work format suits the vacancy.
