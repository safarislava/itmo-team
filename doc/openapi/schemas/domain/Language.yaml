type: object
description: Programming language supported by Runner Servers.
required: [ id, name, version, sourceFilename, runCommand ]
properties:
  id:
    type: string
    format: uuid
    description: Generated by the database.
  name:
    type: string
    minLength: 1
    maxLength: 50
    examples: [ Java ]
  version:
    type: string
    minLength: 1
    maxLength: 20
    description: The pair of name and version is unique.
    examples: [ OpenJDK 21 ]
  sourceFilename:
    type: string
    minLength: 1
    maxLength: 100
    examples: [ Solution.java ]
  compileCommand:
    type: string
    nullable: true
    maxLength: 500
    examples: [ /usr/bin/javac -encoding UTF-8 Solution.java ]
  runCommand:
    type: string
    minLength: 1
    maxLength: 500
    examples: [ /usr/bin/java -Xss64m Solution ]
