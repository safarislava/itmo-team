type: object
description: Programming language supported by Runner Servers.
required: [ id, name, version ]
properties:
  id:
    type: integer
    format: int32
    minimum: 1
    description: Generated by the database.
  name:
    type: string
    minLength: 1
    maxLength: 50
    examples: [ Java ]
  version:
    type: string
    minLength: 1
    maxLength: 20
    description: The pair of name and version is unique.
    examples: [ OpenJDK 21 ]
