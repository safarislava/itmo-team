services:
  postgres:
    image: postgres:16-alpine
    container_name: itmo-team-pg
    environment:
      POSTGRES_DB: dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - local_pg_data:/var/lib/postgresql/data

volumes:
  local_pg_data:
